<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kamus Grammar | Hongo Study</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="font-sans">
    {{> header }}
    <main class="mx-auto max-w-6xl px-5 py-20">
      <div class="mb-10 flex flex-wrap items-end justify-between gap-5">
        <div>
          <p class="font-bold uppercase tracking-widest text-crimson">
            03 · Referensi cepat
          </p>
          <h1 class="mt-2 font-display text-5xl">Kamus tata bahasa</h1>
          <p class="mt-4 max-w-xl leading-7 text-slate-500">
            Cari pola grammar dasar SMA dan pelajari contoh kalimatnya tanpa
            membuka halaman baru.
          </p>
        </div>
        <button
          id="furiganaToggle"
          type="button"
          role="switch"
          aria-checked="true"
          class="flex items-center gap-3 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-bold shadow-sm"
        >
          <span id="furiganaDot" class="h-4 w-4 rounded-full bg-crimson"></span>
          Furigana: <span id="furiganaState">ON</span>
        </button>
      </div>
      <label class="block"
        ><span class="sr-only">Cari tata bahasa</span
        ><input
          id="grammarSearch"
          type="search"
          placeholder="Cari wa, desu, pergi, masen..."
          class="w-full rounded-xl border border-slate-200 bg-white px-5 py-4 text-lg outline-none focus:border-crimson"
      /></label>
      <div id="grammarResults" class="mt-6 grid gap-4 md:grid-cols-2"></div>
    </main>
    {{> footer }}
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
