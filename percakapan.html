<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Percakapan | Hongo Study</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="font-sans">
    {{> header }}
    <main class="mx-auto max-w-4xl px-5 py-20">
      <div class="mb-10 text-center">
        <p class="font-bold uppercase tracking-widest text-crimson">
          02 · Roleplay chat
        </p>
        <h1 class="mt-2 font-display text-5xl">Di depan ruang kelas</h1>
        <p class="mt-4 text-slate-500">
          Pilih balasan bahasa Jepang yang paling tepat untuk melanjutkan
          percakapan.
        </p>
      </div>
      <section
        class="mx-auto max-w-2xl rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"
      >
        <div
          id="chatLog"
          class="min-h-40 space-y-3 rounded-xl bg-mist p-5"
        ></div>
        <div id="chatOptions" class="mt-5 grid gap-3"></div>
        <p
          id="chatStatus"
          class="mt-4 text-sm font-bold text-crimson"
          aria-live="polite"
        ></p>
      </section>
    </main>
    {{> footer }}
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/percakapan.js"></script>
  </body>
</html>
