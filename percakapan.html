<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Roleplay Percakapan | Hongo Study</title>
    <link rel="icon" type="image/svg+xml" href="{{rootPath}}favicon.svg" />
    {{> head }}
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="font-sans">
    {{> header }}
    <main id="main-content" tabindex="-1" class="mx-auto max-w-4xl px-5 py-20">
      <div class="mb-10 text-center">
        <p class="text-sm font-bold text-crimson">
          02 · Roleplay chat
        </p>
        <h1 class="mt-2 font-display text-5xl">Di depan ruang kelas</h1>
        <p class="mt-4 text-slate-500">
          Pilih balasan bahasa Jepang yang paling tepat untuk melanjutkan
          percakapan.
        </p>
      </div>
      <section
        class="mx-auto max-w-2xl rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"
      >
        <h2 id="chatHistoryLabel" class="mb-3 text-sm font-bold">Riwayat percakapan</h2>
        <p id="chatProgress" class="mb-3 text-sm text-slate-600"></p>
        <div tabindex="0" role="region" aria-labelledby="chatHistoryLabel"
          id="chatLog"
          class="chat-history"
        ></div>
        <div id="chatOptions" class="mt-5 grid gap-3"></div>
        <p
          id="chatStatus"
          class="mt-4 text-sm font-bold text-crimson"
          aria-live="polite"
        ></p>
        <button id="chatNext" type="button" class="primary-button mt-4" hidden>Lanjutkan dialog</button>
        <button id="chatRestart" type="button" class="primary-button mt-4" hidden>Ulangi percakapan</button>
      </section>
    </main>
    {{> footer }}
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/percakapan.js"></script>
  </body>
</html>
