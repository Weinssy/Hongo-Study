{{#unless isAndroid}}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet" />
{{/unless}}
<meta name="theme-color" content="#FAF8F5" />
<script>
  (() => {
    {{#if isAndroid}}document.documentElement.classList.add('is-android');{{/if}}
    let saved;
    try { saved = localStorage.getItem('nihongo-theme'); } catch {}
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark-mode', dark);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? '#121316' : '#FAF8F5';
  })();
</script>
