<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet" />
<script>
  (() => {
    let saved;
    try { saved = localStorage.getItem('nihongo-theme'); } catch {}
    document.documentElement.classList.toggle('dark-mode', saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
  })();
</script>
