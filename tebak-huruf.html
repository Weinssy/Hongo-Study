<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tebak Huruf | Hongo Study</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="font-sans">
    {{> header }}
    <main class="mx-auto max-w-6xl px-5 py-20">
      <div class="mb-10">
        <p class="font-bold uppercase tracking-widest text-crimson">
          01 · Game latihan
        </p>
        <h1 class="mt-2 font-display text-5xl">Tebak huruf</h1>
        <p class="mt-4 max-w-xl leading-7 text-slate-500">
          Tulis cara baca karakter yang muncul. Jawab sepuluh ronde dan lihat
          skor terbaikmu.
        </p>
      </div>
      <div class="grid gap-10 lg:grid-cols-[.75fr_1.25fr] lg:items-center">
        <div>
          <div class="flex gap-3 text-sm">
            <span class="rounded-full bg-white px-4 py-2 shadow-sm"
              >Skor <strong id="letterScore">0/10</strong></span
            ><span class="rounded-full bg-white px-4 py-2 shadow-sm"
              >Sisa <strong id="letterRemaining">10</strong></span
            >
          </div>
          <p class="mt-6 text-slate-500">
            Karakter dapat berasal dari Hiragana, Katakana, atau Kanji dasar.
          </p>
        </div>
        <div
          id="letterGame"
          class="rounded-[2rem] bg-ink p-6 text-white shadow-xl md:p-10"
        >
          <div
            class="flex justify-between text-xs font-bold uppercase tracking-widest text-sakura"
          >
            <span id="letterType">Hiragana</span
            ><span id="letterFeedback" aria-live="polite">Siap?</span>
          </div>
          <div
            id="letterCharacter"
            class="my-8 text-center font-display text-8xl"
          >
            あ
          </div>
          <form id="letterForm" class="flex gap-2">
            <input
              id="letterInput"
              required
              autocomplete="off"
              aria-label="Jawaban romaji"
              placeholder="Ketik romaji..."
              class="min-w-0 flex-1 rounded-xl px-4 py-3 text-ink outline-none focus:ring-2 focus:ring-sakura"
            /><button class="rounded-xl bg-sakura px-5 py-3 font-bold text-ink">
              Enter
            </button>
          </form>
          <button
            id="letterNext"
            type="button"
            class="mt-3 hidden w-full rounded-xl border border-sakura px-4 py-3 font-bold text-sakura"
          >
            Lanjut →
          </button>
        </div>
      </div>
    </main>
    {{> footer }}
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/tebak-huruf.js"></script>
  </body>
</html>
